[project]
name = "phitodeep"
version = "0.2.3"
authors = [
    { name = "Ralph Dugue", email = "ralph@phito.dev" }
]
description = "Deep learning framework built from scratch with numpy!"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">= 3.12"
dependencies = [
    "numpy >= 2.4.4"
]

[build-system]
requires = ["uv_build>=0.11.12,<0.12"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[dependency-groups]
dev = [
    "ipykernel (>=7.2.0,<8.0.0)",
    "myst-nb (>=1.4.0,<2.0.0)",
    "sphinx-autoapi (>=3.8.0,<4.0.0)",
    "sphinx-rtd-theme (>=3.1.0,<4.0.0)",
    "pillow (>=12.2.0,<13.0.0)",
    "datasets (>=4.8.4,<5.0.0)",
    "pytest (>=9.0.3,<10.0.0)",
    "jupyter>=1.1.1",
]
